version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gena_valet_db
    environment:
      POSTGRES_USER: gena_user
      POSTGRES_PASSWORD: gena_password_secure_123
      POSTGRES_DB: gena_valet_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gena_user -d gena_valet_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: gena_valet_bot
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
